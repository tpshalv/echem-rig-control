[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "echem-rig-control"
version = "0.1.0"
description = "Control and monitoring software for the automated electrolyser rig"
requires-python = ">=3.14"
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
hardware = ["pyserial>=3.5", "pyvisa>=1.14", "pyvisa-py>=0.7.2"]

[project.scripts]
echem-rig-control = "rig_control.ui.home.window:main"

[tool.pytest.ini_options]
markers = [
    "hardware: tests requiring connected physical hardware",
]
addopts = '-m "not hardware"'
