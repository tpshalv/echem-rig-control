# Example configuration for the electrochemistry rig.
# Copy this file to rig-config.toml and enter the real IP address
# before attempting a physical connection.

[keithley_2260b]
device_id = "main_power_supply"

[keithley_2260b.connection]
host = "CHANGE_ME"
port = 2268
timeout_seconds = 5.0

[keithley_2260b.limits]
maximum_voltage = 30.0
maximum_current = 108.0
maximum_power = 1080.0