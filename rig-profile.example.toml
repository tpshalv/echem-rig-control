[profile]
profile_id = "standard_electrolysis"
friendly_name = "Standard electrolysis rig"


# Shared physical connections

[[connections]]
connection_id = "main_alicat_bus"
connection_type = "serial_text"

[connections.parameters]
port = "CHANGE_ME"
baud_rate = 19200
timeout_seconds = 1.0


[[connections]]
connection_id = "main_power_supply_ethernet"
connection_type = "socket_scpi"

[connections.parameters]
host = "CHANGE_ME"
port = 2268
timeout_seconds = 5.0


[[connections]]
connection_id = "main_esp32"
connection_type = "serial_text"

[connections.parameters]
port = "CHANGE_ME"
baud_rate = 115200
timeout_seconds = 1.0


# Alicat mass-flow controllers sharing one serial bus

[[devices]]
device_id = "nitrogen_mfc"
friendly_name = "Nitrogen"
capability = "mass_flow_controller"
driver = "alicat"
backend = "real"
required = true
enabled = true
connection_id = "main_alicat_bus"

[devices.identity]
manufacturer = "Alicat"

[devices.connection]
address = "A"

[devices.settings]
maximum_flow = 100.0
flow_unit = "sccm"


[[devices]]
device_id = "wet_co2_mfc"
friendly_name = "Wet CO2"
capability = "mass_flow_controller"
driver = "alicat"
backend = "real"
required = true
enabled = true
connection_id = "main_alicat_bus"

[devices.identity]
manufacturer = "Alicat"

[devices.connection]
address = "B"

[devices.settings]
maximum_flow = 100.0
flow_unit = "sccm"


[[devices]]
device_id = "dry_co2_mfc"
friendly_name = "Dry CO2"
capability = "mass_flow_controller"
driver = "alicat"
backend = "real"
required = true
enabled = true
connection_id = "main_alicat_bus"

[devices.identity]
manufacturer = "Alicat"

[devices.connection]
address = "C"

[devices.settings]
maximum_flow = 100.0
flow_unit = "sccm"


# Keithley power supply using its own Ethernet connection

[[devices]]
device_id = "main_power_supply"
friendly_name = "Main power supply"
capability = "dc_power_supply"
driver = "keithley_2260b"
backend = "real"
required = true
enabled = true
connection_id = "main_power_supply_ethernet"

[devices.identity]
manufacturer = "Keithley Instruments"
model = "2260B-30-108"

[devices.settings]
maximum_voltage = 30.0
maximum_current = 108.0
maximum_power = 1080.0


# Sensors sharing the ESP32 connection

[[devices]]
device_id = "cell_temperature"
friendly_name = "Cell temperature"
capability = "temperature_sensor"
driver = "esp32_thermocouple"
backend = "simulated"
required = true
enabled = true
connection_id = "main_esp32"

[devices.connection]
channel = "thermocouple_1"


[[devices]]
device_id = "inlet_humidity"
friendly_name = "Inlet humidity"
capability = "humidity_sensor"
driver = "esp32_humidity"
backend = "simulated"
required = false
enabled = true
connection_id = "main_esp32"

[devices.connection]
channel = "humidity_1"


[[devices]]
device_id = "cell_differential_pressure"
friendly_name = "Cell differential pressure"
capability = "pressure_sensor_differential"
driver = "esp32_analogue_pressure"
backend = "simulated"
required = false
enabled = true
connection_id = "main_esp32"

[devices.connection]
channel = "analogue_1"