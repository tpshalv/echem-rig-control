[profile]
profile_id = "esp32_hardware_poc"
friendly_name = "ESP32 hardware PoC"


[[connections]]
connection_id = "ezo_hum_serial_com4"
connection_type = "serial_text"

[connections.parameters]
port = "COM4"
baud_rate = 9600
timeout_seconds = 2.0


[[connections]]
connection_id = "ezo_hum_serial_com5"
connection_type = "serial_text"

[connections.parameters]
port = "COM5"
baud_rate = 9600
timeout_seconds = 2.0


[[connections]]
connection_id = "pump_serial_com6"
connection_type = "serial_binary"

[connections.parameters]
port = "COM6"
baud_rate = 9600
timeout_seconds = 2.0


[[devices]]
device_id = "inlet_humidity"
friendly_name = "Inlet humidity"
capability = "humidity_sensor"
driver = "atlas_ezo_hum"
backend = "real"
required = true
enabled = true
connection_id = "ezo_hum_serial_com4"
system = "Gas handling"
poll_interval_seconds = 1.0

[devices.identity]
manufacturer = "Atlas Scientific"
model = "EZO-HUM"

[devices.settings]
hardware_label = "Inlet humidity"
include_dew_point = true


[[devices]]
device_id = "outlet_humidity"
friendly_name = "Outlet humidity"
capability = "humidity_sensor"
driver = "atlas_ezo_hum"
backend = "real"
required = true
enabled = true
connection_id = "ezo_hum_serial_com5"
system = "Gas handling"
poll_interval_seconds = 1.0

[devices.identity]
manufacturer = "Atlas Scientific"
model = "EZO-HUM"

[devices.settings]
hardware_label = "Outlet humidity"
include_dew_point = true


[[devices]]
device_id = "pump1"
friendly_name = "Kamoer M1-STP"
capability = "peristaltic_pump"
driver = "kamoer_m1_stp"
backend = "real"
required = true
enabled = true
connection_id = "pump_serial_com6"
system = "Fluid handling"

[devices.settings]
slave = 1
maximum_speed_rpm = 350.0
