[profile]
profile_id = "esp32_hardware_poc"
friendly_name = "ESP32 hardware PoC"


[[connections]]
connection_id = "main_esp32"
connection_type = "serial_json"

[connections.parameters]
port = "COM5"
baud_rate = 115200
timeout_seconds = 2.0
controller_id = "esp32_main_controller"


[[devices]]
device_id = "esp32_main_controller"
friendly_name = "Main ESP32 controller"
capability = "remote_controller"
driver = "esp32_json"
backend = "real"
required = true
enabled = true
connection_id = "main_esp32"

[devices.settings]
controller_id = "esp32_main_controller"
heartbeat_interval_seconds = 2.0


[[devices]]
device_id = "esp32_dht11"
friendly_name = "ESP32 DHT11 temperature and humidity"
capability = "temperature_sensor"
driver = "esp32_dht11"
backend = "real"
required = true
enabled = true
connection_id = "main_esp32"
poll_interval_seconds = 1.5
